# Deliberately no exceptions: hs/no-weeder-exceptions bans them, and hopinion is
# its own first subject. The entries below are roots rather than exceptions.
#
# Type classes are not roots, so an instance nothing reaches is reported like
# any other dead code.
type-class-roots = false
roots = [
  "^Main.main$",
  # Cabal generates this module and nothing in the source calls it.
  "^Paths_.*",
]
root-instances = [
  # Written by persistent's share splice for every table, which nobody can
  # delete one instance of.
  { class = '\.SymbolToField$' },
  { class = '\.ToBackendKey$' },
  { class = '\.AtLeastOneUniqueKey$' },
  { class = '\.OnlyOneUniqueKey$' },
  { class = '\.SafeToInsert$' },
  { instance = '^(PathPiece|FromHttpApiData|ToHttpApiData|PersistFieldSql) [A-Za-z]+Id$' },
  { instance = '^(PathPiece|FromHttpApiData|ToHttpApiData|PersistFieldSql) \(Key [A-Za-z]+\)$' },
  # The entity itself, which has no Id suffix to tell it from a hand-written
  # instance, so only in the modules that call share.
  { instance = '^PersistFieldSql [A-Za-z]+$', module = 'Hopinion/(Store|Check/Obligation|Check/[A-Za-z]+/[A-Za-z]+/Rule)\.hs$' },
]
