name: hopinion
version: 0.0.0

# The warnings this repository is held to. Here rather than in the Nix overlay,
# so that a cabal build in the dev shell says what a Nix build would; the
# overlay adds -Werror on top, which is what makes the difference between a
# warning and a failure a property of how it is built rather than of what it is.
ghc-options:
- -Wall
- -Wincomplete-uni-patterns
- -Wincomplete-record-updates
- -Wpartial-fields
- -Widentities
- -Wredundant-constraints
- -Wcpp-undef
- -Wunused-packages

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src
  dependencies:
  - Cabal-syntax
  - aeson
  - autodocodec
  - autodocodec-schema
  - yaml
  - bytestring
  - conduit
  - containers
  - diagnose
  - filepath
  - path
  - esqueleto
  - file-embed
  - http-api-data
  - path-pieces
  - persistent
  - persistent-sqlite
  - monad-logger
  - mtl
  - resourcet
  - path-io
  - ghc-lib-parser
  - hopinion-hie
  - ghc-lib-parser-ex
  - opt-env-conf
  - prettyprinter
  - prettyprinter-ansi-terminal
  - safe-coloured-text
  - safe-coloured-text-terminfo
  - template-haskell
  - text
  - unliftio
  - unordered-containers
  - validity
  - validity-containers
  - validity-path
  - validity-text

